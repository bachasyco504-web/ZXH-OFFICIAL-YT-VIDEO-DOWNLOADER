<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZXH OFFICIAL YOUTUBE VIDEO DOWNLOADER</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff2e63" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="app">
    <header class="app-header">
      <h1 class="logo">
        <span class="logo-zxh">ZXH</span>
        <span class="logo-sub">OFFICIAL YOUTUBE VIDEO DOWNLOADER</span>
      </h1>
      <p class="tagline">高速 ダウンロード — Anime-powered downloads ⚡</p>
    </header>

    <main class="app-main">
      <form id="download-form" class="search-card">
        <input
          type="url"
          id="video-url"
          placeholder="Paste YouTube video URL here..."
          required
          autocomplete="off"
        />
        <button type="submit" id="fetch-btn">
          <span>Fetch Video</span>
        </button>
      </form>

      <div id="status" class="status" hidden></div>

      <section id="result-card" class="result-card" hidden>
        <img id="result-thumb" class="result-thumb" alt="Video thumbnail" />
        <div class="result-info">
          <h2 id="result-title" class="result-title"></h2>
          <p id="result-author" class="result-author"></p>
          <p id="result-length" class="result-length"></p>

          <label for="format-select" class="format-label">Quality</label>
          <select id="format-select" class="format-select"></select>

          <a id="download-link" class="download-btn" href="#" download>
            <span>⬇ Download</span>
          </a>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>
        ⚠️ For personal use only. Only download content you own or have permission/license to download.
        Respect copyright and YouTube's Terms of Service.
      </p>
      <p class="credit">ZXH OFFICIAL — built with Three.js &amp; Anime.js</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
